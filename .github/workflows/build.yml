name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: mvn clean package

      - name: Create JAR
        run: |
          jar cfe HealthFirstPIMS.jar Login -C target/classes .

      - name: Create EXE
        run: |
          mkdir output
          jpackage --type exe --name KimberleeNaidu_pims --input . --main-jar HealthFirstPIMS.jar --main-class Login --dest output --win-console

      - name: Check EXE
        run: dir output

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KimberleeNaidu_pims
          path: output/KimberleeNaidu_pims.exe
          if-no-files-found: error
